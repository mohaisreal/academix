services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: academix-backend-dev
    env_file:
      - .env.dev
    environment:
      # SMTP de Mailpit — sobrescribe lo definido en .env.dev para que los correos lleguen siempre a Mailpit en desarrollo
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "False"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
    ports:
      - "8000:8000"
    # Montajes de volúmenes para desarrollo con recarga en caliente
    volumes:
      # Monta todo el directorio fuente del backend
      - ./backend:/app
      # Evita sincronizar la caché de Python con el anfitrión
      - /app/__pycache__
      # Excluye los ficheros .pyc y egg-info
      - /app/.pytest_cache
      - /app/*.egg-info
    depends_on:
      - mailpit
    networks:
      - academix-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: academix-frontend-dev
    ports:
      - "4321:4321"
    # Montajes de volúmenes para desarrollo con recarga en caliente
    volumes:
      # Monta todo el directorio fuente del frontend para el modo de vigilancia
      - ./frontend:/app
      # Volumen anónimo para evitar sincronizar node_modules con el anfitrión
      # Esto garantiza que se usen las dependencias instaladas en el contenedor
      - /app/node_modules
      # Excluye artefactos de compilación y directorios de caché
      - /app/.astro
      - /app/dist
    depends_on:
      - backend
    networks:
      - academix-network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: academix-mailpit-dev
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - academix-network
    restart: unless-stopped

networks:
  academix-network:
    driver: bridge
