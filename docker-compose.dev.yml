services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: academix-backend-dev
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    # Volume mounts for hot-reload development
    volumes:
      # Mount entire backend source directory
      - ./backend:/app
      # Prevent Python cache from being synced to host
      - /app/__pycache__
      # Exclude .pyc files and egg-info
      - /app/.pytest_cache
      - /app/*.egg-info
    networks:
      - academix-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: academix-frontend-dev
    ports:
      - "4321:4321"
    # Volume mounts for hot-reload development
    volumes:
      # Mount entire frontend source directory for watch mode
      - ./frontend:/app
      # Anonymous volume to prevent node_modules from being synced with host
      # This ensures dependencies installed in container are used
      - /app/node_modules
      # Exclude build artifacts and cache directories
      - /app/.astro
      - /app/dist
    depends_on:
      - backend
    networks:
      - academix-network
    restart: unless-stopped

networks:
  academix-network:
    driver: bridge
