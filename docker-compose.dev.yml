version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: academix-backend-dev
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - academix-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: academix-frontend-dev
    ports:
      - "4321:4321"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/astro.config.mjs:/app/astro.config.mjs
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/starwind.config.json:/app/starwind.config.json
      - ./frontend/vitest.config.ts:/app/vitest.config.ts
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - academix-network
    restart: unless-stopped

networks:
  academix-network:
    driver: bridge
